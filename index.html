<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ToDo List</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <header class="header">
      <h1>My ToDo List</h1>
      <p>Organize your day, one task at a time</p>
    </header>

    <main class="card">
      <form id="taskForm" class="task-form">
        <input
          type="text"
          id="taskInput"
          placeholder="What do you need to do?"
          autocomplete="off"
          maxlength="120"
        >
        <button type="submit" id="submitBtn">Add Task</button>
      </form>

      <div class="toolbar">
        <div class="filters">
          <button type="button" class="filter-btn active" data-filter="all">All</button>
          <button type="button" class="filter-btn" data-filter="active">Active</button>
          <button type="button" class="filter-btn" data-filter="completed">Done</button>
        </div>
        <span id="taskCount" class="task-count">0 tasks</span>
      </div>

      <ul id="taskList" class="task-list"></ul>

      <p id="emptyState" class="empty-state">No tasks yet. Add your first one above!</p>

      <button type="button" id="clearCompleted" class="clear-btn" hidden>
        Clear completed
      </button>
    </main>
  </div>

  <script src="script.js"></script>
</body>
</html>
